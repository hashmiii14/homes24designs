    <script>
      (function() {
        var loader = document.getElementById('h24-initial-loader');
        var bar = document.getElementById('h24-bar');
        if (!loader) return;

        var duration = 1800; // 1.8 seconds loading progress
        var startTime = performance.now ? performance.now() : Date.now();
        var isDone = false;

        window.__h24_loaded = false;

        function tick() {
          if (isDone) return;
          var now = performance.now ? performance.now() : Date.now();
          var progress = Math.min(1, (now - startTime) / duration);

          // Smooth luxury deceleration curve
          var eased = 1 - Math.pow(1 - progress, 2.2);

          if (bar) bar.style.width = (eased * 100) + '%';

          if (progress < 1) {
            requestAnimationFrame(tick);
          } else {
            isDone = true;
            if (bar) bar.style.width = '100%';

            setTimeout(function() {
              window.__h24_loaded = true;
              window.dispatchEvent(new CustomEvent('h24-loader-done'));
              loader.classList.add('h24-hidden');

              setTimeout(function() {
                if (loader && loader.parentNode) {
                  loader.parentNode.removeChild(loader);
                }
              }, 900);
            }, 80);
          }
        }

        requestAnimationFrame(tick);
      })();
    </script>
